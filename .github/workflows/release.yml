name: Release

# Manual workflow: builds native binaries for every platform (running the
# test suite first) and publishes them as a GitHub release for the current
# version. Does not publish anything to npm.

on:
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-native-binaries.yml

  publish-github-release:
    name: Publish GitHub release
    needs: build
    uses: ./.github/workflows/publish-github-release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.build.outputs.version }}

  cleanup-build-artifacts:
    name: Delete build artifacts
    needs: publish-github-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete per-platform build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const names = new Set([
              'git-diff-pivot-win32-x64',
              'git-diff-pivot-linux-x64',
              'git-diff-pivot-darwin-arm64',
            ]);
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (names.has(artifact.name)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
